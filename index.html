<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kawaii Loading Page</title>

<style>
body{
    margin:0;
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family: "Trebuchet MS", sans-serif;
    background:
        radial-gradient(circle at top left,#fff8fc,#ffd8eb),
        linear-gradient(135deg,#ffdff0,#e7ddff,#dff8ff);
}

.container{
    text-align:center;
    z-index:5;
}

h1{
    color:#ff69b4;
    font-size:3rem;
    text-shadow:3px 3px white;
}

.subtitle{
    color:#b97be8;
    margin-top:10px;
    font-size:1.2rem;
}

.loading{
    width:320px;
    height:20px;
    margin:25px auto;
    background:white;
    border-radius:999px;
    overflow:hidden;
    border:3px solid #ffd3e7;
}

.bar{
    height:100%;
    width:20%;
    border-radius:999px;
    background:linear-gradient(
        90deg,
        #ff8cc8,
        #ffc7e7,
        #d8c8ff
    );
    animation:load 2s infinite ease-in-out;
}

@keyframes load{
    0%{width:10%;}
    50%{width:90%;}
    100%{width:10%;}
}

.sparkle{
    position:absolute;
    color:white;
    font-size:24px;
    animation:float 10s linear infinite;
    pointer-events:none;
}

@keyframes float{
    from{
        transform:translateY(110vh) rotate(0deg);
    }
    to{
        transform:translateY(-20vh) rotate(360deg);
    }
}

/* Cursor mascots */

.mascot{
    position:absolute;
    pointer-events:none;
    transform:translate(-50%,-50%);
    animation:pop 1.8s forwards;
}

@keyframes pop{
    0%{
        opacity:0;
        transform:translate(-50%,-50%) scale(.2);
    }
    20%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:translate(-50%,-100px) scale(1);
    }
}

.bunny,
.sheep{
    font-size:42px;
    filter:drop-shadow(0 0 8px rgba(255,255,255,.9));
}
</style>
</head>
<body>

<div class="container">
    <h1>🌸 Welcome, page is loading 🌸</h1>

    <div class="loading">
        <div class="bar"></div>
    </div>

    <div class="subtitle">
        Please wait while something magical is prepared...
    </div>

    <div style="margin-top:20px;font-size:1.4rem">
        🐑 💖 🎀 ✨ ☁️ 🌷
    </div>
</div>

<script>

// floating sparkles
for(let i=0;i<30;i++){
    const s=document.createElement("div");
    s.className="sparkle";
    s.innerHTML=Math.random()>0.5?"✦":"❤";

    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(6+Math.random()*8)+"s";
    s.style.opacity=Math.random();

    document.body.appendChild(s);
}

// cursor mascots
const icons=[
    {emoji:"🐰", class:"bunny"},
    {emoji:"🐑", class:"sheep"},
    {emoji:"🎀", class:"bunny"},
    {emoji:"💖", class:"sheep"}
];

document.addEventListener("mousemove",(e)=>{

    if(Math.random()>.55){

        const mascot=document.createElement("div");
        mascot.className="mascot";

        const item=icons[Math.floor(Math.random()*icons.length)];

        mascot.innerHTML=
            `<div class="${item.class}">${item.emoji}</div>`;

        mascot.style.left=e.clientX+"px";
        mascot.style.top=e.clientY+"px";

        document.body.appendChild(mascot);

        setTimeout(()=>{
            mascot.remove();
        },1800);
    }
});

</script>

</body>
</html>
