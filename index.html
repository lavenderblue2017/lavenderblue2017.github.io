<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ coming soon... ✨</title>

<style>
:root{
    --pink:#ffd6ea;
    --pink-dark:#ff9fc9;
    --lavender:#e8dcff;
    --mint:#dffcf3;
    --cream:#fffaf5;
    --text:#7a5f7d;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:"Comic Sans MS","Trebuchet MS",sans-serif;
    background:
        radial-gradient(circle at top left, #fff6c7 0%, transparent 30%),
        radial-gradient(circle at bottom right, #dffcf3 0%, transparent 30%),
        linear-gradient(135deg,var(--pink),var(--lavender),var(--mint));
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
}

/* 🌟 floating sparkles */
.sparkle{
    position:absolute;
    color:white;
    animation:float 5s ease-in-out infinite;
    opacity:0.8;
    pointer-events:none;
}

.sparkle:nth-child(1){top:8%;left:10%;font-size:2rem;}
.sparkle:nth-child(2){top:15%;right:12%;font-size:1.5rem;animation-delay:1s;}
.sparkle:nth-child(3){bottom:12%;left:15%;font-size:2.2rem;animation-delay:2s;}
.sparkle:nth-child(4){bottom:8%;right:10%;font-size:1.8rem;animation-delay:3s;}
.sparkle:nth-child(5){top:45%;left:5%;font-size:1.5rem;animation-delay:1.5s;}
.sparkle:nth-child(6){top:40%;right:5%;font-size:1.5rem;animation-delay:2.5s;}

@keyframes float{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-15px) rotate(10deg);}
}

/* 💖 main card */
.card{
    background:rgba(255,255,255,0.75);
    backdrop-filter:blur(10px);
    border:4px solid rgba(255,255,255,0.8);
    border-radius:36px;
    padding:50px 40px;
    text-align:center;
    max-width:850px;
    width:90%;
    box-shadow:0 15px 40px rgba(255,182,220,0.35);
    position:relative;
    z-index:2;
}

.title{
    color:var(--text);
    font-size:clamp(2.2rem,5vw,4rem);
    margin-bottom:15px;
    text-shadow:2px 2px 0 white;
}

/* 🍡 mochi */
.mochi-field{
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
    margin-bottom:30px;
}

.mochi{
    width:130px;
    height:130px;
    position:relative;
    animation:bounce 2s ease-in-out infinite;
}

.mochi:nth-child(2){animation-delay:.4s;}
.mochi:nth-child(3){animation-delay:.8s;}

@keyframes bounce{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
}

.daifuku{
    width:110px;
    height:95px;
    background:#fffafc;
    border-radius:50%;
    position:absolute;
    left:10px;
    top:15px;
    border:3px solid rgba(255,182,220,0.35);
    box-shadow:
        inset 0 -10px 0 rgba(255,214,234,0.5),
        0 8px 18px rgba(255,182,220,0.25);
}

.daifuku::before{
    content:"";
    position:absolute;
    width:50px;
    height:32px;
    background:#ffb6d9;
    border-radius:50%;
    left:50%;
    top:12px;
    transform:translateX(-50%);
}

.eye{
    position:absolute;
    width:6px;
    height:12px;
    background:#5f4d61;
    border-radius:10px;
    top:44px;
}

.eye.left{left:38px;}
.eye.right{right:38px;}

.mouth{
    position:absolute;
    width:16px;
    height:8px;
    border-bottom:3px solid #5f4d61;
    border-radius:0 0 20px 20px;
    left:50%;
    top:58px;
    transform:translateX(-50%);
}

.blush{
    position:absolute;
    width:16px;
    height:10px;
    background:#ffb6d9;
    border-radius:50%;
    opacity:0.75;
    top:54px;
}

.blush.left{left:18px;}
.blush.right{right:18px;}

/* 💫 loading bar */
.label{
    color:#ff8fb1;
    font-size:20px;
    margin-bottom:12px;
}

.bar{
    width:100%;
    height:28px;
    background:#ffe4f1;
    border-radius:999px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(255,182,193,0.3);
}

.fill{
    height:100%;
    width:0%;
    border-radius:999px;
    background:linear-gradient(
        90deg,
        #ffb3ba,#ffdfba,#ffffba,#baffc9,#bae1ff,#e3c6ff
    );
    animation:load 5s ease-in-out forwards;
    position:relative;
}

@keyframes load{
    0%{width:0%;}
    100%{width:100%;}
}

/* 💖 sparkles text */
.hearts{
    margin-top:20px;
    font-size:1.4rem;
    letter-spacing:8px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.08);}
}

/* ✨ cursor particles */
.particle{
    position:fixed;
    pointer-events:none;
    z-index:9999;
    animation:fade 1s ease-out forwards;
}

@keyframes fade{
    0%{
        transform:translate(0,0) scale(1);
        opacity:1;
    }
    100%{
        transform:translate(var(--x), var(--y)) scale(0.3);
        opacity:0;
    }
}
</style>
</head>

<body>

<!-- sparkles -->
<div class="sparkle">✨</div>
<div class="sparkle">🌟</div>
<div class="sparkle">✨</div>
<div class="sparkle">⭐</div>
<div class="sparkle">💖</div>
<div class="sparkle">🌸</div>

<div class="card">

    <div class="mochi-field">

        <div class="mochi">
            <div class="daifuku">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
            </div>
        </div>

        <div class="mochi">
            <div class="daifuku">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
            </div>
        </div>

        <div class="mochi">
            <div class="daifuku">
                <div class="eye left"></div>
                <div class="eye right"></div>
                <div class="mouth"></div>
                <div class="blush left"></div>
                <div class="blush right"></div>
            </div>
        </div>

    </div>

    <div class="title">🌸 Welcome! 🌸</div>

    <div class="label">Loading cuteness...</div>

    <div class="bar">
        <div class="fill"></div>
    </div>

    <div class="hearts">
        💖 ✨ 🍡 🌸 ✨ 💖
    </div>

</div>

<script>
/* 🌈 cursor rainbow particle trail */
const colors = ["#ffb3ba","#ffdfba","#ffffba","#baffc9","#bae1ff","#e3c6ff","#ffd6ea"];

document.addEventListener("mousemove", (e) => {
    const p = document.createElement("div");
    p.className = "particle";

    const size = Math.random() * 14 + 6;

    p.style.width = size + "px";
    p.style.height = size + "px";
    p.style.borderRadius = Math.random() > 0.5 ? "50%" : "30%";
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = e.clientX + "px";
    p.style.top = e.clientY + "px";

    const x = (Math.random() - 0.5) * 120 + "px";
    const y = (Math.random() - 0.5) * 120 + "px";

    p.style.setProperty("--x", x);
    p.style.setProperty("--y", y);

    document.body.appendChild(p);

    setTimeout(() => p.remove(), 1000);
});
</script>

</body>
</html>
